# Build, test and publish the langfuse-lite image to GHCR. Runs only when started
# by hand (Actions → image → Run workflow), so nothing is published by a push.
name: image
on:
  workflow_dispatch:
    inputs:
      langfuse_tag:
        description: "Langfuse image tag to build on (docker.langfuse.com/langfuse/langfuse:<tag>)"
        default: "4"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANGFUSE_IMAGE_TAG: ${{ inputs.langfuse_tag }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/langfuse-lite:${{ inputs.langfuse_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: scripts/setup.sh
      - run: scripts/build-image.sh
      - name: Smoke test
        run: |
          docker run -d --name lite -p 3000:3000 "$IMAGE"
          for i in $(seq 120); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' lite)" = healthy ] && break
            sleep 1
          done
          python3 scripts/smoke.py
          docker stop lite
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker tag "$IMAGE" "$IMAGE-${GITHUB_SHA::7}"
          docker push "$IMAGE"
          docker push "$IMAGE-${GITHUB_SHA::7}"
